<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kroatien-Olympiade LIVE</title>
<style>
:root{--n:#17324d;--bg:#f3f6f8;--g:#16834b;--r:#b43b3b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--n);color:white;padding:16px 20px;font-weight:900;font-size:20px}
.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000012}
button,input,select{font:inherit;border-radius:11px;border:1px solid #ccd5dd;padding:13px}
button{background:var(--n);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#e5ebf0;color:#17324d}.good{background:var(--g)}.danger{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hide{display:none!important}
.big{font-size:42px;font-weight:900;text-align:center}.timer{font-size:68px;font-weight:950;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:#667684}.answer{display:block;width:100%;margin:8px 0;text-align:left}.answer.sel{outline:4px solid #9bbbd6}
.status{padding:10px;border-radius:9px;background:#edf2f6;margin:6px 0}.ok{background:#def4e7}.bad{background:#fae1e1}
.pill{display:inline-block;padding:5px 9px;background:#e8eef3;border-radius:99px;margin:3px;font-size:13px}.check{opacity:.42;text-decoration:line-through}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.code{letter-spacing:5px}.teamBtn{min-height:56px}
</style>
</head>
<body>
<header>🇭🇷 Kroatien-Olympiade LIVE</header>
<div class="wrap">
<section id="setup" class="card">
<h2>Verbinden</h2>
<p class="muted">Alle Geräte öffnen dieselbe Seite. Jan erstellt den Raum, die Kapitäne treten mit dem Raumcode bei.</p>
<div class="grid">
<button id="hostBtn">JAN – SPIELLEITER</button>
<button id="captainBtn" class="secondary">KAPITÄN</button>
<button id="screenBtn" class="secondary">TV / BEAMER</button><button id="playerBtn" class="secondary">SPIELER / BUZZER</button>
</div>
<div id="joinBox" class="hide" style="margin-top:16px">
<input id="roomIn" placeholder="RAUMCODE" maxlength="6" style="width:100%;text-transform:uppercase">
<div id="teamChoices" class="grid" style="margin-top:10px">
<button class="teamBtn" data-team="team1">Team 1</button>
<button class="teamBtn" data-team="team2">Team 2</button>
<button class="teamBtn" data-team="team3">Team 3</button>
</div>
<button id="screenJoinBtn" class="hide" style="width:100%;margin-top:10px">TV / BEAMER VERBINDEN</button>
<div id="playerChoices" class="hide" style="margin-top:10px"><select id="playerSelect" style="width:100%">
<option>Kevin</option><option>Markus</option><option>Stefan</option><option>Kay</option><option>Michel</option><option>Patrick</option><option>Mario</option><option>Fabian</option><option>Timo</option><option>Andre</option><option>Klemm</option><option>Swen</option>
</select><button id="playerJoinBtn" style="width:100%;margin-top:10px">ALS SPIELER VERBINDEN</button></div>
</div>
</section>

<section id="hostView" class="hide">
<div class="card"><div class="muted">Raumcode</div><div id="roomCode" class="big code"></div><div id="connections"></div></div>
<div class="tabs">
<button data-mode="quiz">Kroatien-Quiz</button>
<button data-mode="estimate">Schätzmeister</button>
<button data-mode="category">Kategorien</button><button data-mode="emoji">Emoji-Songs</button><button data-mode="buzzer">Buzzer-Spiel</button>
</div>
<div id="hostGame"></div>
</section>

<section id="captainView" class="hide">
<div class="card"><div id="teamName"></div><div id="capTimer" class="timer">–</div><div id="capGame"><p class="muted">Warte auf Jan …</p></div></div>
</section>

<section id="playerView" class="hide"><div class="card"><div id="playerName" class="big" style="font-size:28px"></div><div id="buzzState" class="muted" style="text-align:center;margin:12px 0">Warte auf Jan …</div><button id="buzzBtn" class="danger" disabled style="width:100%;height:220px;font-size:46px;border-radius:28px">BUZZER</button></div></section>
<section id="screenView" class="hide">
<div class="card"><div id="screenTitle" class="big">Warte auf Jan …</div><div id="screenTimer" class="timer">–</div><div id="screenStatus"></div></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="data.js?v=8"></script>
<script>
"use strict";
const D=window.GAME_DATA;
if(!Array.isArray(D.emoji)){
  D.emoji=[
    ["👁️ 🐅 🥊 🏆","Eye of the Tiger","Survivor"],
    ["🛣️ ➡️ 🔥 😈","Highway to Hell","AC/DC"],
    ["🕺 👑 👩 🎶","Dancing Queen","ABBA"],
    ["🏨 🌴 ☀️ 🇺🇸","Hotel California","Eagles"],
    ["👧 🔥 🔥 🎤","Girl on Fire","Alicia Keys"],
    ["🧊 🧊 👶 🎤","Ice Ice Baby","Vanilla Ice"],
    ["🎂 🍰 🌊 🏖️","Cake by the Ocean","DNCE"],
    ["🚀 👨 🌙 ⭐","Rocket Man","Elton John"],
    ["💜 ☔ 🌧️ 👑","Purple Rain","Prince"],
    ["🖤 🟡 🖤 🟡","Black and Yellow","Wiz Khalifa"],
    ["☀️ 🚶‍♂️ 😊 🎶","Walking on Sunshine","Katrina and the Waves"],
    ["👶 👶 👶 🔙","Baby Got Back","Sir Mix-a-Lot"],
    ["💰 💰 💰 👩","Money, Money, Money","ABBA"],
    ["🕺 🌙 ⭐ 🌃","Dancing in the Moonlight","Toploader"],
    ["🙋 ❤️ 🪨 🎸","I Love Rock 'n' Roll","Joan Jett & the Blackhearts"]
  ];
}
const $=id=>document.getElementById(id);
let peer=null, conns={}, conn=null, role=null, room=null, modeName="quiz";
let timerInt=null, answers={}, used=new Set(), qidx=0, eidx=0, currentClientKind=null;
let catName=Object.keys(D.categories)[0];
let buzzOrder=[], buzzOpen=false;
let emojiIdx=0, emojiPhase="idle", emojiWinner=null, emojiAttempts={team1:0,team2:0,team3:0}, emojiPoints={team1:0,team2:0,team3:0};

function show(view){
  ["setup","hostView","captainView","playerView","screenView"].forEach(id=>$(id).classList.add("hide"));
  $(view).classList.remove("hide");
}
function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function ensurePeer(){
  if(typeof Peer==="undefined"){alert("PeerJS konnte nicht geladen werden. Bitte Internetverbindung prüfen.");return false;}
  return true;
}
function openJoin(kind){
  role=kind;
  $("joinBox").classList.remove("hide");
  $("teamChoices").classList.toggle("hide",kind==="screen"||kind==="player");
  $("screenJoinBtn").classList.toggle("hide",kind!=="screen");
  $("playerChoices").classList.toggle("hide",kind!=="player");
  $("roomIn").focus();
}
function host(){
  if(!ensurePeer())return;
  role="host"; room=roomCode();
  peer=new Peer("kroatien-"+room);
  peer.on("open",()=>{
    show("hostView"); $("roomCode").textContent=room; refreshConnections(); renderHost();
  });
  peer.on("connection",c=>{
    c.on("data",m=>onHostMessage(m,c));
  });
  peer.on("error",e=>alert("Verbindungsfehler: "+e.type));
}
function join(teamRole){
  if(!ensurePeer())return;
  room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  role=teamRole;
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect("kroatien-"+room,{reliable:true});
    conn.on("open",()=>{
      conn.send({type:"join",role});
      if(role==="screen") show("screenView");
      else{
        show("captainView");
        $("teamName").innerHTML="<b>"+D.teams[role].name+"</b><div class='muted'>"+D.teams[role].players+"</div>";
      }
    });
    conn.on("data",onClientMessage);
    conn.on("error",()=>alert("Verbindung zum Spielleiter fehlgeschlagen."));
  });
}
function joinPlayer(){
  if(!ensurePeer())return; room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  const name=$("playerSelect").value; role="player:"+name; peer=new Peer();
  peer.on("open",()=>{conn=peer.connect("kroatien-"+room,{reliable:true});conn.on("open",()=>{conn.send({type:"join",role,name});show("playerView");$("playerName").textContent=name;});conn.on("data",onClientMessage);});
}
function onHostMessage(m,c){
  if(m.type==="join"){conns[m.role]=c; refreshConnections();}
  if(m.type==="buzz" && buzzOpen && !buzzOrder.includes(m.name)){buzzOrder.push(m.name);broadcastBuzzOrder();renderHost();}
  if(m.type==="answer"){
    if(modeName==="emoji" && (emojiPhase==="title"||emojiPhase==="artist")) handleEmojiAnswer(m.role,m.value);
    else {answers[m.role]=m.value; renderHost();}
  }
}
function refreshConnections(){
  const base=["team1","team2","team3","screen"].map(r=>"<span class='pill'>"+(r==="screen"?"TV":D.teams[r].name)+": "+(conns[r]?"✓":"–")+"</span>").join("");
  $("connections").innerHTML=base+"<span class='pill'>Spieler: "+Object.keys(conns).filter(x=>x.startsWith("player:")).length+"/12</span>";
}
function sendAll(msg){Object.values(conns).forEach(c=>{try{c.send(msg)}catch(e){}});}
function onClientMessage(m){
  if(m.type==="buzzState" && role && role.startsWith("player:")){$("buzzBtn").disabled=!m.open;$("buzzState").textContent=m.open?"🟢 BUZZER FREI!":"🔒 Buzzer gesperrt";}
  if(m.type==="buzzReset" && role && role.startsWith("player:")){$("buzzBtn").disabled=true;$("buzzState").textContent="Neue Runde – warte auf Jan …";}
  if(m.type==="buzzPosition" && role && role.startsWith("player:")){const name=role.slice(7),p=m.order.indexOf(name);if(p>=0){$("buzzBtn").disabled=true;$("buzzState").innerHTML="<b>Du bist "+(p+1)+".</b>";}}
  if(m.type==="buzzBoard" && role==="screen"){$("screenTitle").textContent=m.open?"🔴 BUZZER OFFEN":"🔒 BUZZER";$("screenTimer").textContent="";$("screenStatus").innerHTML=m.order.length?m.order.map((n,i)=>"<div class='status' style='font-size:"+(i===0?34:24)+"px'><b>"+(i+1)+". "+n+"</b></div>").join(""):"<div class='big' style='font-size:30px'>Noch niemand gebuzzert</div>";}
  if(m.type==="start") startLocal(m);
  if(m.type==="feedback" && role!=="screen"){
    const old=$("capGame").querySelector(".emojiFeedback"); if(old)old.remove();
    $("capGame").insertAdjacentHTML("beforeend","<div class='emojiFeedback'>"+m.html+"</div>");
  }
  if(m.type==="reset"){
    clearInterval(timerInt);
    if(role==="screen"){$("screenTitle").textContent="Warte auf Jan …";$("screenTimer").textContent="–";$("screenStatus").innerHTML="";}
    else {$("capTimer").textContent="–";$("capGame").innerHTML="<p class='muted'>Warte auf Jan …</p>";}
  }
  if(m.type==="reveal"){
    if(role==="screen"){
      $("screenStatus").innerHTML=m.html;
    }else{
      clearInterval(timerInt);
      $("capTimer").textContent="✓";
      $("capGame").innerHTML="<h2>Auflösung</h2>"+m.html;
    }
  }
}
function countdown(end,el,done){
  clearInterval(timerInt);
  const tick=()=>{
    const s=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=s;
    if(s<=0){clearInterval(timerInt);if(done)done();}
  };
  tick(); timerInt=setInterval(tick,200);
}
function startLocal(m){
  currentClientKind=m.kind;
  if(role==="screen"){
    $("screenTitle").textContent=m.title;
    if(m.kind==="emojiTitle"){
      $("screenStatus").innerHTML="<div class='big' style='font-size:80px;margin:25px 0'>"+m.emojis+"</div><div class='muted'>Songtitel gesucht</div>";
    }else if(m.kind==="emojiArtist"){
      $("screenStatus").innerHTML="<div class='big' style='font-size:70px;margin:18px 0'>"+m.emojis+"</div><div class='status ok' style='font-size:30px'><b>Titel: "+m.songTitle+"</b></div><div class='muted'>Jetzt Interpret – 30 Sekunden</div>";
    }else if(m.kind==="quiz" && Array.isArray(m.options)){
      $("screenStatus").innerHTML=
        "<div class='grid' style='margin-top:18px'>"+
        m.options.map((x,i)=>
          "<div class='status' style='font-size:24px;font-weight:800;padding:16px'>"+
          String.fromCharCode(65+i)+" · "+x+
          "</div>"
        ).join("")+
        "</div><div class='muted' style='margin-top:12px'>Team-Antworten und richtige Lösung bleiben bis zur Auflösung verborgen.</div>";
    }else{
      $("screenStatus").innerHTML="<div class='muted'>Antworten noch verborgen</div>";
    }
    countdown(m.end,$("screenTimer"));
    return;
  }
  let h="<h2>"+m.title+"</h2>";
  if(m.kind==="quiz"){
    m.options.forEach((x,i)=>h+="<button class='answer secondary qanswer' data-value='"+i+"'>"+String.fromCharCode(65+i)+" · "+x+"</button>");
  } else if(m.kind==="estimate"){
    h+="<input id='txtAns' type='number' inputmode='numeric' placeholder='Kilometer' style='width:100%'><button id='sendText' class='answer'>ABSCHICKEN</button>";
  } else if(m.kind==="category"){
    h+="<input id='txtAns' autocomplete='off' placeholder='Antwort' style='width:100%'><button id='sendText' class='answer'>ABSCHICKEN</button>";
  } else if(m.kind==="emojiTitle"){
    h+="<div class='big' style='font-size:54px;margin:15px 0'>"+m.emojis+"</div><p><b>Songtitel gesucht</b> · maximal 3 Versuche</p><input id='txtAns' autocomplete='off' placeholder='Songtitel' style='width:100%'><button id='sendText' class='answer'>VERSUCH ABSCHICKEN</button>";
  } else if(m.kind==="emojiArtist"){
    h+="<div class='big' style='font-size:42px;margin:12px 0'>"+m.emojis+"</div><div class='status ok'><b>Titel: "+m.songTitle+"</b></div><p><b>Interpret gesucht</b> · 30 Sekunden · maximal 3 Versuche</p><input id='txtAns' autocomplete='off' placeholder='Interpret' style='width:100%'><button id='sendText' class='answer'>VERSUCH ABSCHICKEN</button>";
  }
  $("capGame").innerHTML=h;
  document.querySelectorAll(".qanswer").forEach(b=>b.addEventListener("click",()=>submitChoice(Number(b.dataset.value),b)));
  const sb=$("sendText"); if(sb)sb.addEventListener("click",submitText);
  countdown(m.end,$("capTimer"),()=>lockCaptain("Zeit abgelaufen"));
}
function submitChoice(v,b){
  document.querySelectorAll(".qanswer").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel"); conn.send({type:"answer",role,value:v}); lockCaptain("Antwort gesendet ✓");
}
function submitText(){
  const e=$("txtAns"); if(!e||!e.value.trim())return;
  conn.send({type:"answer",role,value:e.value.trim()});
  if(!(currentClientKind==="emojiTitle"||currentClientKind==="emojiArtist")) lockCaptain("Antwort gesendet ✓");
  else { e.value=""; e.focus(); }
}
function lockCaptain(msg){
  document.querySelectorAll("#capGame button,#capGame input").forEach(x=>x.disabled=true);
  if(!$("capGame").querySelector(".status"))$("capGame").insertAdjacentHTML("beforeend","<div class='status'>"+msg+"</div>");
}
function setMode(m){
  modeName=m; answers={};
  if(m==="emoji" && !["idle","title","artist","done"].includes(emojiPhase)) resetEmojiRound();
  renderHost();
}
function answerStatus(category=false){
  return "<div class='card'>"+["team1","team2","team3"].map(t=>{
    const val=answers[t]===undefined?"—":String(answers[t]);
    const accept=category&&answers[t]!==undefined?" <button class='good acceptCat' data-team='"+t+"'>✓</button>":"";
    return "<div class='status'><b>"+D.teams[t].name+":</b> "+val+accept+"</div>";
  }).join("")+"</div>";
}
function renderHost(){
  let h="";
  if(modeName==="quiz"){
    const q=D.quiz[qidx];
    h="<div class='card'><h2>Frage "+(qidx+1)+"/"+D.quiz.length+"</h2><p>"+q[0]+"</p>"+
      q[1].map((x,i)=>"<span class='pill'>"+String.fromCharCode(65+i)+" · "+x+"</span>").join("")+
      "<p><button id='startBtn'>30 SEK. START</button> <button id='revealBtn' class='secondary'>AUFLÖSEN</button></p>"+
      answerStatus(false)+"<div id='hostReveal'></div><div class='grid'><button id='prevBtn' class='secondary'>←</button><button id='nextBtn'>NÄCHSTE →</button></div></div>";
  } else if(modeName==="estimate"){
    const e=D.estimate[eidx];
    h="<div class='card'><h2>Schätzmeister "+(eidx+1)+"/"+D.estimate.length+"</h2><p class='big'>"+e[0]+"</p><p class='muted'>Lösung: "+Number(e[1]).toLocaleString("de-DE")+" km</p>"+
      "<p><button id='startBtn'>30 SEK. START</button> <button id='revealBtn' class='secondary'>AUSWERTEN</button></p>"+
      answerStatus(false)+"<div id='hostReveal'></div><div class='grid'><button id='prevBtn' class='secondary'>←</button><button id='nextBtn'>NÄCHSTE →</button></div></div>";
  } else if(modeName==="category"){
    h="<div class='card'><h2>Kategorien-Battle</h2><select id='catSelect' style='width:100%'>"+
      Object.keys(D.categories).map(x=>"<option "+(x===catName?"selected":"")+">"+x+"</option>").join("")+
      "</select><p><select id='turnTeam'><option value='team1'>Team 1</option><option value='team2'>Team 2</option><option value='team3'>Team 3</option></select> <button id='catStart'>35 SEK. START</button></p>"+
      answerStatus(true)+"<div>"+D.categories[catName].map(x=>"<span class='pill "+(used.has(norm(x))?"check":"")+"'>"+x+"</span>").join("")+"</div></div>";
  }
  if(modeName==="buzzer"){
    h="<div class='card'><h2>🔴 Buzzer-Spiel</h2><p class='muted'>Alle 12 Spieler buzzern auf dem eigenen Handy. Die Reihenfolge bleibt erhalten, damit bei einer falschen Antwort der Nächste dran ist.</p><div class='grid'><button id='buzzOpenBtn' class='good'>BUZZER FREIGEBEN</button><button id='buzzCloseBtn' class='secondary'>SPERREN</button><button id='buzzResetBtn' class='danger'>NEUE RUNDE</button></div><h3>Reihenfolge</h3>"+(buzzOrder.length?buzzOrder.map((n,i)=>"<div class='status' style='font-size:"+(i===0?26:18)+"px'><b>"+(i+1)+". "+n+"</b></div>").join(""):"<div class='status'>Noch niemand gebuzzert.</div>")+"<p><b>Status:</b> "+(buzzOpen?"🟢 Buzzer offen":"🔒 Buzzer gesperrt")+"</p></div>";
  }
  if(modeName==="emoji"){
    const s=D.emoji[emojiIdx];
    const phaseText=emojiPhase==="title"?"Titel läuft – bis ein Team richtig antwortet":emojiPhase==="artist"?"Interpret läuft – 30 Sekunden":emojiPhase==="done"?"Runde beendet":"Bereit";
    h="<div class='card'><h2>Emoji-Songs "+(emojiIdx+1)+"/"+D.emoji.length+"</h2>"+
      "<div class='big' style='font-size:58px;margin:20px 0'>"+s[0]+"</div>"+
      "<div class='status'><b>Status:</b> "+phaseText+"</div>"+
      (emojiPhase==="idle"?"<button id='emojiStart'>TITEL-RATEN STARTEN</button>":"")+
      (emojiPhase==="title"?"<button id='emojiRevealTitle' class='secondary'>TITEL MANUELL AUFLÖSEN</button>":"")+
      (emojiPhase==="artist"?"<div class='status ok'><b>Titel: "+s[1]+"</b></div>":"")+
      (emojiPhase==="done"?"<div class='status ok'><b>"+s[1]+"</b> · "+s[2]+"</div>":"")+
      "<div class='card'>"+["team1","team2","team3"].map(t=>"<div class='status'><b>"+D.teams[t].name+"</b> · Punkte: <b style='font-size:22px'>"+("I".repeat(emojiPoints[t])||"–")+"</b> <span class='muted'>("+emojiPoints[t]+")</span> · Versuche: "+emojiAttempts[t]+"/3</div>").join("")+"</div>"+
      "<div class='grid'><button id='emojiPrev' class='secondary'>←</button><button id='emojiNext'>NÄCHSTER SONG →</button></div></div>";
  }
  $("hostGame").innerHTML=h;
  bindHostControls();
}
function bindHostControls(){
  const start=$("startBtn"), reveal=$("revealBtn"), prev=$("prevBtn"), next=$("nextBtn");
  if(start)start.addEventListener("click",()=>startRound(30));
  if(reveal)reveal.addEventListener("click",()=>modeName==="quiz"?revealQuiz():revealEstimate());
  if(prev)prev.addEventListener("click",()=>{answers={};if(modeName==="quiz")qidx=Math.max(0,qidx-1);else eidx=Math.max(0,eidx-1);renderHost();});
  if(next)next.addEventListener("click",()=>{answers={};if(modeName==="quiz")qidx=Math.min(D.quiz.length-1,qidx+1);else eidx=Math.min(D.estimate.length-1,eidx+1);renderHost();});
  const cs=$("catSelect"); if(cs)cs.addEventListener("change",()=>{catName=cs.value;used=new Set();answers={};renderHost();});
  const catStart=$("catStart"); if(catStart)catStart.addEventListener("click",startCategory);
  document.querySelectorAll(".acceptCat").forEach(b=>b.addEventListener("click",()=>acceptCategory(b.dataset.team)));
  const bo=$("buzzOpenBtn"); if(bo)bo.addEventListener("click",openBuzzers);
  const bc=$("buzzCloseBtn"); if(bc)bc.addEventListener("click",closeBuzzers);
  const br=$("buzzResetBtn"); if(br)br.addEventListener("click",resetBuzzers);
  const es=$("emojiStart"); if(es)es.addEventListener("click",startEmojiTitle);
  const er=$("emojiRevealTitle"); if(er)er.addEventListener("click",()=>startEmojiArtist(null));
  const ep=$("emojiPrev"); if(ep)ep.addEventListener("click",()=>changeEmoji(-1));
  const en=$("emojiNext"); if(en)en.addEventListener("click",()=>changeEmoji(1));
}
function startRound(sec){
  answers={}; const end=Date.now()+sec*1000;
  if(modeName==="quiz"){
    const q=D.quiz[qidx]; sendAll({type:"start",kind:"quiz",end,title:"Frage "+(qidx+1)+": "+q[0],options:q[1]});
  }else{
    sendAll({type:"start",kind:"estimate",end,title:"Schätzmeister: "+D.estimate[eidx][0]});
  }
  renderHost();
}
function revealQuiz(){
  const q=D.quiz[qidx], correct=q[2]; let html="";
  ["team1","team2","team3"].forEach(t=>{
    const a=answers[t],ok=Number(a)===correct;
    html+="<div class='status "+(ok?"ok":"bad")+"'>"+D.teams[t].name+": "+(a===undefined?"—":String.fromCharCode(65+Number(a))+" · "+q[1][Number(a)])+"</div>";
  });
  html+="<p><b>Richtig: "+String.fromCharCode(65+correct)+" · "+q[1][correct]+"</b></p>";
  const hr=$("hostReveal"); if(hr)hr.innerHTML="<div class='card'>"+html+"</div>";
  sendAll({type:"reveal",html});
}
function revealEstimate(){
  const sol=Number(D.estimate[eidx][1]), pts=[3,2,1];
  const arr=["team1","team2","team3"].filter(t=>answers[t]!==undefined)
    .map(t=>[t,Number(answers[t]),Math.abs(Number(answers[t])-sol)]).sort((a,b)=>a[2]-b[2]);
  let html="<p><b>Lösung: "+sol.toLocaleString("de-DE")+" km</b></p>";
  arr.forEach((x,i)=>html+="<div class='status'>"+pts[i]+" Punkte: "+D.teams[x[0]].name+" – "+x[1].toLocaleString("de-DE")+" km</div>");
  const hr=$("hostReveal"); if(hr)hr.innerHTML="<div class='card'>"+html+"</div>";
  sendAll({type:"reveal",html});
}

function simpleNorm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
}
function emojiCorrect(input,target){
  const a=simpleNorm(input), b=simpleNorm(target);
  if(a===b)return true;
  return editDistance(a,b)<=Math.max(1,Math.min(2,Math.floor(b.length/8)));
}
function resetEmojiRound(){
  emojiPhase="idle"; emojiWinner=null; emojiAttempts={team1:0,team2:0,team3:0}; emojiPoints={team1:0,team2:0,team3:0}; answers={};
}
function changeEmoji(d){
  emojiIdx=Math.max(0,Math.min(D.emoji.length-1,emojiIdx+d)); resetEmojiRound(); sendAll({type:"reset"}); renderHost();
}
function startEmojiTitle(){
  resetEmojiRound(); emojiPhase="title";
  const s=D.emoji[emojiIdx];
  // Effectively no countdown: 24h; ends immediately when first correct title arrives.
  const end=Date.now()+86400000;
  sendAll({type:"start",kind:"emojiTitle",end,title:"Emoji-Song: Titel gesucht",emojis:s[0]});
  renderHost();
}
function sendEmojiFeedback(team,msg,good=false){
  if(conns[team])conns[team].send({type:"feedback",html:"<div class='status "+(good?"ok":"bad")+"'>"+msg+"</div>"});
}
function handleEmojiAnswer(team,value){
  const s=D.emoji[emojiIdx];
  if(emojiAttempts[team]>=3){sendEmojiFeedback(team,"Keine Versuche mehr.");return;}
  emojiAttempts[team]++;
  const target=emojiPhase==="title"?s[1]:s[2];
  if(emojiCorrect(value,target)){
    if(emojiPhase==="title"){
      emojiWinner=team;
      emojiPoints[team]+=2;
      sendEmojiFeedback(team,"Richtig! +2 Punkte",true);
      startEmojiArtist(team);
    }else if(emojiPhase==="artist"){
      emojiWinner=team;
      emojiPoints[team]+=1;
      emojiPhase="done";
      clearInterval(timerInt);
      sendAll({type:"reveal",html:"<div class='status ok'><b>Interpret: "+s[2]+"</b></div><div class='status'><b>"+D.teams[team].name+" war zuerst richtig: +1 Punkt</b></div>"});
      renderHost();
    }
  }else{
    sendEmojiFeedback(team,"Leider falsch · noch "+(3-emojiAttempts[team])+" Versuch(e).");
    renderHost();
  }
}
function startEmojiArtist(titleWinner){
  const s=D.emoji[emojiIdx];
  emojiPhase="artist"; emojiWinner=titleWinner;
  // New 3 attempts for artist for every team.
  emojiAttempts={team1:0,team2:0,team3:0};
  const end=Date.now()+30000;
  sendAll({type:"start",kind:"emojiArtist",end,title:"Interpret gesucht",emojis:s[0],songTitle:s[1]});
  renderHost();

    if(modeName==="emoji" && emojiPhase==="artist"){
      emojiPhase="done";
      sendAll({type:"reveal",html:"<div class='status'><b>Zeit abgelaufen.</b></div><div class='status ok'>Interpret: "+s[2]+"</div>"});
      renderHost();
    }
  },30200);
}

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function editDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(
      dp[i-1][j]+1,
      dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
    );
  }
  return dp[m][n];
}
function fuzzyMatch(input,list){
  const ni=norm(input);
  if(!ni)return null;
  let best=null,bestDist=999;
  for(const x of list){
    const nx=norm(x);
    if(nx===ni)return x;
    if(ni.length>=4 && (nx.includes(ni)||ni.includes(nx))) return x;
    const d=editDistance(ni,nx);
    if(d<bestDist){bestDist=d;best=x;}
  }
  // 1 typo for short answers; up to 2 for medium/long answers.
  const allowed=ni.length<=4?1:(ni.length<=8?2:2);
  return bestDist<=allowed?best:null;
}
function acceptCategory(t){
  const a=answers[t], list=D.categories[catName];
  const match=fuzzyMatch(a,list);
  if(!match){alert("Nicht eindeutig erkannt: "+a+" – bitte manuell prüfen.");return;}
  if(used.has(norm(match))){alert("Schon genannt: "+match);return;}
  used.add(norm(match)); answers={}; renderHost();
}
