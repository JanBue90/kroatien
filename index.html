<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kroatien-Olympiade LIVE</title>
<style>
:root{--n:#17324d;--bg:#f3f6f8;--g:#16834b;--r:#b43b3b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--n);color:white;padding:16px 20px;font-weight:900;font-size:20px}
.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000012}
button,input,select{font:inherit;border-radius:11px;border:1px solid #ccd5dd;padding:13px}
button{background:var(--n);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#e5ebf0;color:#17324d}.good{background:var(--g)}.danger{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hide{display:none!important}
.big{font-size:42px;font-weight:900;text-align:center}.timer{font-size:68px;font-weight:950;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:#667684}.answer{display:block;width:100%;margin:8px 0;text-align:left}.answer.sel{outline:4px solid #9bbbd6}
.status{padding:10px;border-radius:9px;background:#edf2f6;margin:6px 0}.ok{background:#def4e7}.bad{background:#fae1e1}
.pill{display:inline-block;padding:5px 9px;background:#e8eef3;border-radius:99px;margin:3px;font-size:13px}.check{opacity:.42;text-decoration:line-through}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.code{letter-spacing:5px}.teamBtn{min-height:56px}

/* v13 mobile-first fixes */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{min-width:0}
header{width:100%;padding:14px 16px;font-size:18px;white-space:normal}
main{width:min(1180px,100%);max-width:100%;padding:16px;margin:0 auto}
.card{max-width:100%;overflow:hidden}
.grid{min-width:0}
button,select,input{max-width:100%;min-width:0}
#setup .card{width:100%;max-width:980px;margin:0 auto}
#setup .grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px}
#setup button{white-space:normal;line-height:1.15;padding:15px 8px}
#playerView .card{max-width:560px;margin:0 auto}
#buzzBtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:700px){
  main{padding:10px}
  header{font-size:17px;padding:12px}
  .card{padding:16px;border-radius:16px}
  #setup .grid{grid-template-columns:1fr 1fr!important;gap:8px}
  #setup button{font-size:14px;padding:14px 6px}
  #setup h2{font-size:22px}
  #setup p{font-size:14px;line-height:1.4}
  #roomIn,#teamSelect,#playerSelect{width:100%;font-size:16px;height:52px}
  #teamJoinBtn,#screenJoinBtn,#playerJoinBtn{height:56px;font-size:16px}
  #playerView .card{padding:14px}
  #playerName{text-align:center;font-size:25px!important}
  #buzzState{font-size:18px}
  #buzzBtn{height:55vh!important;min-height:300px;font-size:44px!important;border-radius:24px!important}
}
@media(max-width:390px){
  #setup .grid{grid-template-columns:1fr!important}
}

@keyframes nextFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.025);box-shadow:0 0 24px rgba(255,180,0,.65)}}.next-warning{background:#fff0b8!important;border:3px solid #f0a000!important;animation:nextFlash .8s infinite;font-weight:900}.current-warning{background:#dff5e7!important;border:3px solid #22a35a!important;font-weight:900}#playerRanking .status{margin:6px 0}
/* v15 TV / spectator polish */
#screenView{min-height:calc(100vh - 70px)}
#screenView>.card{
  max-width:1400px;margin:18px auto;padding:34px;border-radius:28px;
  box-shadow:0 14px 45px rgba(0,0,0,.12);min-height:75vh;
}
#screenTitle{text-align:center;font-size:42px;line-height:1.1;margin:8px 0 18px}
#screenTimer{
  text-align:center;font-size:88px;font-weight:900;line-height:1;
  margin:12px auto 24px;min-height:88px;
}
#screenStatus{max-width:1100px;margin:0 auto}
#screenStatus .status{
  border-radius:18px;padding:14px 20px;margin:8px 0;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.tv-current{
  background:#dff5e7!important;border:4px solid #22a35a!important;
  transform:scale(1.02);box-shadow:0 8px 30px rgba(34,163,90,.22)!important;
}
.tv-next{
  background:#fff0b8!important;border:3px solid #f0a000!important;
}
.tv-rank{
  display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;
}
.tv-rank-no{font-size:28px;font-weight:900;text-align:center}
.tv-rank-name{font-size:28px;font-weight:900}
.tv-rank-tag{font-size:18px;font-weight:900}
@media(max-width:700px){
  #screenView>.card{margin:6px;padding:18px;min-height:85vh}
  #screenTitle{font-size:30px}
  #screenTimer{font-size:64px;min-height:64px}
  .tv-rank{grid-template-columns:48px 1fr auto;gap:8px}
  .tv-rank-no,.tv-rank-name{font-size:20px}
  .tv-rank-tag{font-size:13px}
}


/* Promi-Mix */
.pm-stage{max-width:1050px;margin:auto;text-align:center}
.pm-puzzle{position:relative;width:min(72vw,720px);aspect-ratio:1/1;margin:18px auto;border-radius:24px;overflow:hidden;background:#10283e;box-shadow:0 15px 45px rgba(0,0,0,.22)}
.pm-puzzle img{width:100%;height:100%;object-fit:cover;display:block}
.pm-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.pm-tile{background:#193852;border:1px solid rgba(255,255,255,.45);transition:opacity .35s,transform .35s}
.pm-tile.open{opacity:0;transform:scale(.92);pointer-events:none}
.pm-solution{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;margin-top:20px}
.pm-photo{background:#edf2f6;border-radius:20px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.pm-photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px}
.pm-photo .label{font-weight:900;font-size:20px;padding:10px 4px}
.pm-config{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-config input{width:100%}
@media(max-width:700px){
 .pm-puzzle{width:100%}
 .pm-solution{grid-template-columns:1fr}
 .pm-config{grid-template-columns:1fr}
}

/* v18 Kegeltour-Fotospiel */
.tour-photo{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:18px;background:#101820;box-shadow:0 10px 28px #0002}
.tour-host-photo{max-height:420px;margin:10px auto}
.tour-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-top:12px}.tour-score .status{text-align:center}
#playerTourPhoto{width:100%;max-height:42vh;object-fit:contain;border-radius:14px;background:#101820;margin:8px 0}
@media(max-width:700px){#playerView.tour-active #buzzBtn{height:110px!important;min-height:110px!important;font-size:30px!important}#playerView.tour-active .card{padding:10px}.tour-photo{max-height:50vh}}
</style>
</head>
<body>
<header>🇭🇷 Kroatien-Olympiade LIVE <span style="font-size:12px;opacity:.65">v20</span></header>
<div class="wrap">
<section id="setup" class="card">
<h2>Verbinden</h2>
<p class="muted">Alle Geräte öffnen dieselbe Seite. Jan erstellt den Raum, die Kapitäne treten mit dem Raumcode bei.</p>
<div class="grid">
<button id="hostBtn">JAN – SPIELLEITER</button>
<button id="captainBtn" class="secondary">KAPITÄN</button>
<button id="screenBtn" class="secondary">TV / BEAMER</button><button id="playerBtn" type="button" class="secondary">SPIELER / BUZZER</button>
</div>
<div id="joinBox" class="hide" style="margin-top:16px">
<input id="roomIn" placeholder="RAUMCODE" maxlength="6" style="width:100%;text-transform:uppercase">
<div id="teamChoices" class="grid" style="margin-top:10px">
<button class="teamBtn" data-team="team1">Team 1</button>
<button class="teamBtn" data-team="team2">Team 2</button>
<button class="teamBtn" data-team="team3">Team 3</button>
</div>
<button id="screenJoinBtn" class="hide" style="width:100%;margin-top:10px">TV / BEAMER VERBINDEN</button>
<div id="playerChoices" class="hide" style="margin-top:10px"><select id="playerSelect" style="width:100%">
<option>Kevin</option><option>Markus</option><option>Stefan</option><option>Kay</option><option>Michel</option><option>Patrick</option><option>Mario</option><option>Fabian</option><option>Timo</option><option>Andre</option><option>Klemm</option><option>Swen</option>
</select><button id="playerJoinBtn" type="button" style="width:100%;margin-top:10px">ALS SPIELER VERBINDEN</button></div>
</div>
</section>

<section id="hostView" class="hide">
<div class="card"><div class="muted">Raumcode</div><div id="roomCode" class="big code"></div><div id="connections"></div></div>
<div class="tabs">
<button data-mode="quiz">Kroatien-Quiz</button>
<button data-mode="estimate">Schätzmeister</button>
<button data-mode="category">Kategorien</button><button data-mode="emoji">Emoji-Songs</button><button data-mode="buzzer">Buzzer-Spiel</button><button data-mode="tourpics">Kegeltour-Fotos</button>
</div>
<div id="hostGame"></div>
</section>

<section id="captainView" class="hide">
<div class="card"><div id="teamName"></div><div id="capTimer" class="timer">–</div><div id="capGame"><p class="muted">Warte auf Jan …</p></div></div>
</section>

<section id="playerView" class="hide"><div class="card"><div id="playerName" class="big" style="font-size:28px"></div><div id="playerTourBox" class="hide"><img id="playerTourPhoto" alt="Kegeltour-Foto"><div id="playerTourHint" class="status" style="text-align:center;font-weight:900"></div></div><div id="buzzState" class="muted" style="text-align:center;margin:12px 0">Warte auf Jan …</div><button id="buzzBtn" class="danger" disabled style="width:100%;height:220px;font-size:46px;border-radius:28px">BUZZER</button><div id="playerBuzzBoard" class="hide" style="margin-top:12px"><div id="playerAlert" class="status" style="text-align:center;font-size:22px"></div><div id="playerCountdown" class="big" style="text-align:center;font-size:82px;margin:10px 0;font-weight:900"></div><div id="playerRanking"></div></div></div></section>
<section id="screenView" class="hide">
<div class="card"><div id="screenTitle" class="big">Warte auf Jan …</div><div id="screenTimer" class="timer">–</div><div id="screenStatus"></div></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="data.js?v=8"></script>
<script>
"use strict";
const D=window.GAME_DATA;
if(!Array.isArray(D.emoji)){
  D.emoji=[
    ["👁️ 🐅 🥊 🏆","Eye of the Tiger","Survivor"],
    ["🛣️ ➡️ 🔥 😈","Highway to Hell","AC/DC"],
    ["🕺 👑 👩 🎶","Dancing Queen","ABBA"],
    ["🏨 🌴 ☀️ 🇺🇸","Hotel California","Eagles"],
    ["👧 🔥 🔥 🎤","Girl on Fire","Alicia Keys"],
    ["🧊 🧊 👶 🎤","Ice Ice Baby","Vanilla Ice"],
    ["🎂 🍰 🌊 🏖️","Cake by the Ocean","DNCE"],
    ["🚀 👨 🌙 ⭐","Rocket Man","Elton John"],
    ["💜 ☔ 🌧️ 👑","Purple Rain","Prince"],
    ["🖤 🟡 🖤 🟡","Black and Yellow","Wiz Khalifa"],
    ["☀️ 🚶‍♂️ 😊 🎶","Walking on Sunshine","Katrina and the Waves"],
    ["👶 👶 👶 🔙","Baby Got Back","Sir Mix-a-Lot"],
    ["💰 💰 💰 👩","Money, Money, Money","ABBA"],
    ["🕺 🌙 ⭐ 🌃","Dancing in the Moonlight","Toploader"],
    ["🙋 ❤️ 🪨 🎸","I Love Rock 'n' Roll","Joan Jett & the Blackhearts"]
  ];
}
const $=id=>document.getElementById(id);
let peer=null, conns={}, conn=null, role=null, room=null, modeName="quiz";
let timerInt=null, answers={}, used=new Set(), qidx=0, eidx=0, currentClientKind=null;
let catName=Object.keys(D.categories)[0];
let buzzOrder=[], buzzOpen=false, buzzAnswerIndex=0, buzzAnswerTimer=null, buzzAnswerEnd=0, buzzExpired=false;
let clientTourRound=null, clientTourPhase=null;
let promiIdx=0, promiReveal=0, promiSolved=false, promiTimer=null;
let promiRounds=JSON.parse(localStorage.getItem("promiRounds")||"null")||Array.from({length:12},(_,i)=>({brother:"",celebrity:"",mix:"",brotherImg:"",celebrityImg:""}));
const TOUR_ROUNDS=[{"place":"Stuttgart","year":2023,"img":"tour_12.jpg"},{"place":"München","year":2012,"img":"tour_07.jpg"},{"place":"Amsterdam","year":2015,"img":"tour_13.jpg"},{"place":"Breslau","year":2017,"img":"tour_18.jpg"},{"place":"Münster","year":2014,"img":"tour_08.jpg"},{"place":"Frankfurt","year":2022,"img":"tour_02.jpg"},{"place":"Breslau","year":2017,"img":"tour_17.jpg"},{"place":"Berlin","year":2016,"img":"tour_14.jpg"},{"place":"Stuttgart","year":2023,"img":"tour_11.jpg"},{"place":"Bremen","year":2023,"img":"tour_15.jpg"},{"place":"München","year":2012,"img":"tour_06.jpg"},{"place":"Frankfurt","year":2022,"img":"tour_03.jpg"},{"place":"Brügge","year":2025,"img":"tour_01.jpg"},{"place":"Hamburg","year":2020,"img":"tour_04.jpg"},{"place":"Bremen","year":2023,"img":"tour_16.jpg"},{"place":"Sophia","year":2019,"img":"tour_09.jpg"},{"place":"Sophia","year":2019,"img":"tour_10.jpg"},{"place":"Krakau","year":2018,"img":"tour_05.jpg"}];
let tourIdx=0,tourPhase="idle",tourScores={},tourLocationWinner=null;

let emojiIdx=0, emojiPhase="idle", emojiWinner=null, emojiAttempts={team1:0,team2:0,team3:0}, emojiPoints={team1:0,team2:0,team3:0};

function show(view){
  ["setup","hostView","captainView","playerView","screenView"].forEach(id=>$(id).classList.add("hide"));
  $(view).classList.remove("hide");
}
function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function ensurePeer(){
  if(typeof Peer==="undefined"){alert("PeerJS konnte nicht geladen werden. Bitte Internetverbindung prüfen.");return false;}
  return true;
}
function openJoin(kind){
  role=kind;
  $("joinBox").classList.remove("hide");
  $("teamChoices").classList.toggle("hide",kind==="screen"||kind==="player");
  $("screenJoinBtn").classList.toggle("hide",kind!=="screen");
  $("playerChoices").classList.toggle("hide",kind!=="player");
  $("roomIn").focus();
}
function host(){
  if(!ensurePeer())return;
  role="host"; room=roomCode();
  peer=new Peer("kroatien-"+room);
  peer.on("open",()=>{
    show("hostView"); $("roomCode").textContent=room; refreshConnections(); renderHost();
  });
  peer.on("connection",c=>{
    c.on("data",m=>onHostMessage(m,c));
  });
  peer.on("error",e=>alert("Verbindungsfehler: "+e.type));
}
function join(teamRole){
  if(!ensurePeer())return;
  room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  role=teamRole;
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect("kroatien-"+room,{reliable:true});
    conn.on("open",()=>{
      conn.send({type:"join",role});
      if(role==="screen") show("screenView");
      else{
        show("captainView");
        $("teamName").innerHTML="<b>"+D.teams[role].name+"</b><div class='muted'>"+D.teams[role].players+"</div>";
      }
    });
    conn.on("data",onClientMessage);
    conn.on("error",()=>alert("Verbindung zum Spielleiter fehlgeschlagen."));
  });
}
function joinPlayer(){
  room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  const name=$("playerSelect").value;
  if(!name){alert("Bitte Spieler auswählen.");return;}
  role="player:"+name;

  const connectPlayer=()=>{
    conn=peer.connect("kroatien-"+room,{reliable:true});
    conn.on("open",()=>{
      conn.send({type:"join",role,name});
      show("playerView");
      $("playerName").textContent=name;
      $("buzzState").textContent="Verbunden – warte auf Jan …";
    });
    conn.on("data",onClientMessage);
    conn.on("error",()=>alert("Verbindung fehlgeschlagen. Bitte Raumcode prüfen."));
  };

  if(!peer){
    if(!window.Peer){alert("PeerJS konnte nicht geladen werden. Internetverbindung prüfen.");return;}
    peer=new Peer();
    peer.on("open",connectPlayer);
    peer.on("error",e=>alert("Verbindung fehlgeschlagen: "+e.type));
  }else if(peer.open){
    connectPlayer();
  }else{
    peer.once("open",connectPlayer);
  }
}
function onHostMessage(m,c){
  if(m.type==="join"){conns[m.role]=c; refreshConnections();}
  if(m.type==="buzz" && buzzOpen && !buzzOrder.includes(m.name)){
    buzzOrder.push(m.name);
    if(buzzOrder.length===1){buzzAnswerIndex=0; startBuzzAnswerTimer();}
    broadcastBuzzOrder(); renderHost();
  }
  if(m.type==="answer"){
    if(modeName==="emoji" && (emojiPhase==="title"||emojiPhase==="artist")) handleEmojiAnswer(m.role,m.value);
    else {answers[m.role]=m.value; renderHost();}
  }
}
function refreshConnections(){
  const base=["team1","team2","team3","screen"].map(r=>"<span class='pill'>"+(r==="screen"?"TV":D.teams[r].name)+": "+(conns[r]?"✓":"–")+"</span>").join("");
  $("connections").innerHTML=base+"<span class='pill'>Spieler: "+Object.keys(conns).filter(x=>x.startsWith("player:")).length+"/12</span>";
}
function sendAll(msg){Object.values(conns).forEach(c=>{try{c.send(msg)}catch(e){}});}
function onClientMessage(m){
  if(m.type==="buzzState" && role && role.startsWith("player:")){$("buzzBtn").disabled=!m.open;$("buzzState").textContent=m.open?"🟢 BUZZER FREI!":"🔒 Buzzer gesperrt";}
  if(m.type==="buzzReset" && role && role.startsWith("player:")){$("buzzBtn").classList.remove("hide");$("buzzBtn").disabled=true;$("playerBuzzBoard").classList.add("hide");$("playerRanking").innerHTML="";$("playerCountdown").textContent="";$("buzzState").textContent="Neue Runde – warte auf Jan …";}
  if(m.type==="buzzPosition" && role && role.startsWith("player:")){
    const name=role.slice(7),p=m.order.indexOf(name),cur=m.order.indexOf(m.current);
    if((m.tourPhase==="year" || m.tourPhase==="done") && m.tourWinner && name!==m.tourWinner){
      $("buzzBtn").classList.add("hide"); $("playerBuzzBoard").classList.remove("hide");
      $("buzzState").innerHTML="<b>Der Ort wurde gelöst.</b>";
      $("playerAlert").className="status ok";
      $("playerAlert").innerHTML="✅ <b>"+m.tourWinner+"</b> hat den Ort richtig. Nur er darf jetzt noch das Jahr raten.";
      $("playerRanking").innerHTML=""; $("playerCountdown").textContent=""; clearInterval(timerInt);
      return;
    }
    if(p>=0){
      $("buzzBtn").classList.add("hide");$("playerBuzzBoard").classList.remove("hide");
      $("buzzState").innerHTML="<b>Du hast gebuzzert: Platz "+(p+1)+"</b>";
      $("playerRanking").innerHTML="<h3>Buzzer-Reihenfolge</h3>"+m.order.map((n,i)=>"<div class='status' style='font-size:18px;"+(n===m.current?"background:#dff5e7":"")+"'><b>"+(i+1)+". "+n+(n===m.current?" ← DRAN":"")+"</b></div>").join("");
      const a=$("playerAlert");
      if(m.current===name && m.expired){a.className="status";a.innerHTML="⏱ ZEIT ABGELAUFEN – SPIELLEITER ENTSCHEIDET";}
      else if(m.current===name){a.className="status current-warning";a.innerHTML="🔥 DU BIST DRAN! JETZT ANTWORTEN!";}
      else if(cur>=0&&p===cur+1){a.className="status next-warning";a.innerHTML="⚠️ ACHTUNG – DU BIST ALS NÄCHSTER DRAN!";}
      else{a.className="status";a.innerHTML=m.current?"Aktuell antwortet: <b>"+m.current+"</b>":"Warte auf die Auswertung …";}
      if(m.answerEnd)countdown(m.answerEnd,$("playerCountdown"));else{clearInterval(timerInt);if(m.expired)$("playerCountdown").textContent="0";else $("playerCountdown").textContent="";}
    }
  }
  if(m.type==="tourState"){
    clientTourRound=m.round; clientTourPhase=m.phase;
    if(role==="screen"){
      clearInterval(timerInt); $("screenTimer").textContent="";
      if(m.phase==="idle"){
        $("screenTitle").innerHTML="📸 NÄCHSTES FOTO <span style='font-size:22px'>"+(m.idx+1)+"/"+m.total+"</span>";
        $("screenStatus").innerHTML="<div style='text-align:center;font-size:34px;font-weight:900;padding:80px 10px'>🔒 BUZZER BEREIT<br><span style='font-size:22px'>Warte auf den Rundenstart …</span></div>";
      } else {
        $("screenTitle").innerHTML="📸 WO WAR DAS? <span style='font-size:22px'>"+(m.idx+1)+"/"+m.total+"</span>";
        $("screenStatus").innerHTML="<img class='tour-photo' src='"+m.round.img+"'>"+(m.phase==="year"?"<div class='status ok' style='text-align:center;font-size:28px'><b>✓ "+m.round.place+"</b><br>Welches Jahr?</div>":m.phase==="done"?"<div class='status ok' style='text-align:center;font-size:30px'><b>"+m.round.place+" · "+m.round.year+"</b></div>":"<div style='text-align:center;font-size:26px;font-weight:900;margin-top:12px'>WO WAR DIESE KEGELTOUR?</div>");
      }
    } else if(role&&role.startsWith("player:")){
      clearInterval(timerInt); $("playerCountdown").textContent="";
      if(m.phase==="idle"){
        $("playerView").classList.remove("tour-active"); $("playerTourBox").classList.add("hide");
        $("buzzBtn").classList.remove("hide"); $("buzzBtn").disabled=true; $("buzzState").textContent="🔒 Buzzer bereit – warte auf Rundenstart …";
      } else {
        $("playerView").classList.add("tour-active"); $("playerTourBox").classList.remove("hide"); $("playerTourPhoto").src=m.round.img;
        const pn=role.slice(7);

function countdown(end,el,done){
  clearInterval(timerInt);
  const tick=()=>{
    const s=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=s;
    if(s<=0){clearInterval(timerInt);if(done)done();}
  };
  tick(); timerInt=setInterval(tick,200);
}

function simpleNorm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
}
function emojiCorrect(input,target){
  const a=simpleNorm(input), b=simpleNorm(target);
  if(a===b)return true;
  return editDistance(a,b)<=Math.max(1,Math.min(2,Math.floor(b.length/8)));
}

  const s=D.emoji[emojiIdx];
  if(emojiAttempts[team]>=3){sendEmojiFeedback(team,"Keine Versuche mehr.");return;}
  emojiAttempts[team]++;
  const target=emojiPhase==="title"?s[1]:s[2];
  if(emojiCorrect(value,target)){
    if(emojiPhase==="title"){
      emojiWinner=team;
      emojiPoints[team]+=2;
      sendEmojiFeedback(team,"Richtig! +2 Punkte",true);
      startEmojiArtist(team);
    }else if(emojiPhase==="artist"){
      emojiWinner=team;

      sendAll({type:"reveal",html:"<div class='status ok'><b>Interpret: "+s[2]+"</b></div><div class='status'><b>"+D.teams[team].name+" war zuerst richtig: +1 Punkt</b></div>"});

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function editDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(
      dp[i-1][j]+1,
      dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
    );
  }
  return dp[m][n];
}
function fuzzyMatch(input,list){
  const ni=norm(input);
  if(!ni)return null;
  let best=null,bestDist=999;
  for(const x of list){
    const nx=norm(x);
    if(nx===ni)return x;
    if(ni.length>=4 && (nx.includes(ni)||ni.includes(nx))) return x;
    const d=editDistance(ni,nx);
    if(d<bestDist){bestDist=d;best=x;}
  }
  // 1 typo for short answers; up to 2 for medium/long answers.
  const allowed=ni.length<=4?1:(ni.length<=8?2:2);
  return bestDist<=allowed?best:null;
}
function acceptCategory(t){
  const a=answers[t], list=D.categories[catName];
  const match=fuzzyMatch(a,list);
  if(!match){alert("Nicht eindeutig erkannt: "+a+" – bitte manuell prüfen.");return;}
  if(used.has(norm(match))){alert("Schon genannt: "+match);return;}
  used.add(norm(match)); answers={}; renderHost();
}
