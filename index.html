*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--n);color:white;padding:16px 20px;font-weight:900;font-size:20px}
.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000012}
button,input,select{font:inherit;border-radius:11px;border:1px solid #ccd5dd;padding:13px}
button{background:var(--n);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#e5ebf0;color:#17324d}.good{background:var(--g)}.danger{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hide{display:none!important}
.big{font-size:42px;font-weight:900;text-align:center}.timer{font-size:68px;font-weight:950;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:#667684}.answer{display:block;width:100%;margin:8px 0;text-align:left}.answer.sel{outline:4px solid #9bbbd6}
.status{padding:10px;border-radius:9px;background:#edf2f6;margin:6px 0}.ok{background:#def4e7}.bad{background:#fae1e1}
.pill{display:inline-block;padding:5px 9px;background:#e8eef3;border-radius:99px;margin:3px;font-size:13px}.check{opacity:1;text-decoration:line-through;background:#dff5e7!important;border:2px solid #22a35a;color:#116534;font-weight:900}
.tabs{display:flex;gap:7px;flex-wrap:wrap;overflow:visible;margin-bottom:12px}.tabs button{white-space:normal;flex:1 1 150px}
.code{letter-spacing:5px}.teamBtn{min-height:56px}

*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{min-width:0}
header{width:100%;padding:14px 16px;font-size:18px;white-space:normal}
main{width:min(1180px,100%);max-width:100%;padding:16px;margin:0 auto}
.card{max-width:100%;overflow:hidden}
.grid{min-width:0}
button,select,input{max-width:100%;min-width:0}
#setup .card{width:100%;max-width:980px;margin:0 auto}

#setup button{white-space:normal;line-height:1.15;padding:15px 8px}

  border-radius:18px;padding:14px 20px;margin:8px 0;

  .tv-rank-tag{font-size:13px}

/* Promi-Mix */
.pm-stage{max-width:1050px;margin:auto;text-align:center}
.pm-puzzle{position:relative;width:min(72vw,720px);aspect-ratio:1/1;margin:18px auto;border-radius:24px;overflow:hidden;background:#10283e;box-shadow:0 15px 45px rgba(0,0,0,.22)}
.pm-puzzle img{width:100%;height:100%;object-fit:cover;display:block}
.pm-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.pm-tile{background:#193852;border:1px solid rgba(255,255,255,.45);transition:opacity .35s,transform .35s}
.pm-tile.open{opacity:0;transform:scale(.92);pointer-events:none}
.pm-solution{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;margin-top:20px}
.pm-photo{background:#edf2f6;border-radius:20px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.pm-photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px}
.pm-photo .label{font-weight:900;font-size:20px;padding:10px 4px}
.pm-config{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-config input{width:100%}
@media(max-width:700px){
 .pm-puzzle{width:100%}
 .pm-solution{grid-template-columns:1fr}
 .pm-config{grid-template-columns:1fr}

function onHostMessage(m,c){

  if(m.type==="join"){conns[m.role]=c; refreshConnections();}
  if(m.type==="buzz" && buzzOpen && !buzzOrder.includes(m.name)){
    buzzOrder.push(m.name);
    if(buzzOrder.length===1){buzzAnswerIndex=0; startBuzzAnswerTimer();}
    broadcastBuzzOrder(); renderHost();
  }

  if(m.type==="zgLive" && modeName==="zimmer"){
    if(!ZG_PLAYERS.includes(m.name) || zgOut.has(m.name))return;
    zgLive[m.name]=m.data||{};
    zgLiveBroadcast();
    renderHost();
    return;
  }
  if(m.type==="zgAnswer" && modeName==="zimmer"){
    const name=m.name;
    if(!ZG_PLAYERS.includes(name) || zgOut.has(name) || zgAnswers[name]!==undefined)return;
    zgAnswers[name]=Number(m.value);
    renderHost();
    if(zgRound<4 && zgRemaining().every(n=>zgAnswers[n]!==undefined)) zgRevealRound();
    return;
  }
  if(m.type==="zgReaction" && modeName==="zimmer" && zgRound===3 && zgPhase==="playing"){
    const name=m.name;
    if(!ZG_PLAYERS.includes(name) || zgOut.has(name) || zgAnswers[name]!==undefined)return;
    zgAnswers[name]={ms:Number(m.ms),early:!!m.early};
    renderHost();
    if(zgRemaining().every(n=>zgAnswers[n]!==undefined)) zgRevealRound();
    return;
  }
  if(m.type==="zgRpsChoice" && modeName==="zimmer" && zgRound===4 && zgPhase==="rps" && zgRpsPlayers.includes(m.name)){
    if(Number(m.token)!==zgRpsToken || zgRpsChoices[m.name])return;
    zgRpsChoices[m.name]=m.choice;
    zgLive[m.name]={kind:"rps",chosen:true};
    zgLiveBroadcast(); renderHost();
    if(zgRpsPlayers.every(n=>zgRpsChoices[n])) zgResolveRps();
    return;
  }

    if(modeName==="emoji" && (emojiPhase==="title"||emojiPhase==="artist")) handleEmojiAnswer(m.role,m.value);

    }
  }
}

function countdown(end,el,done){
  clearInterval(timerInt);
  const tick=()=>{
    const s=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=s;
    if(s<=0){clearInterval(timerInt);if(done)done();}
  };
  tick(); timerInt=setInterval(tick,200);
}

function startRound(sec){
  answers={}; const end=Date.now()+sec*1000;
  if(modeName==="quiz"){
    const q=D.quiz[qidx]; sendAll({type:"start",kind:"quiz",end,title:"Frage "+(qidx+1)+": "+q[0],options:q[1],scores:{...quizScores}});
  }else{
    sendAll({type:"start",kind:"estimate",end,title:"Schätzmeister: "+D.estimate[eidx][0],scores:{...estimateScores}});
  }
  renderHost();
}
function revealQuiz(auto=false){
  const q=D.quiz[qidx], correct=q[2];
  if(!quizAwarded.has(qidx)){
    ["team1","team2","team3"].forEach(t=>{if(answers[t]!==undefined && Number(answers[t])===correct)quizScores[t]=(quizScores[t]||0)+1;});
    quizAwarded.add(qidx);
  }
  let html="";
  ["team1","team2","team3"].forEach(t=>{
    const a=answers[t],ok=Number(a)===correct;
    html+="<div class='status "+(ok?"ok":"bad")+"'>"+D.teams[t].name+": "+(a===undefined?"—":String.fromCharCode(65+Number(a))+" · "+q[1][Number(a)])+"</div>";
  });
  html+="<p><b>Richtig: "+String.fromCharCode(65+correct)+" · "+q[1][correct]+"</b></p>"+quizScoreHtml(quizScores);
  const hr=$("hostReveal"); if(hr)hr.innerHTML="<div class='card'>"+html+"</div>";
  sendAll({type:"reveal",html,scores:{...quizScores}});
  renderHost();
  const hr2=$("hostReveal"); if(hr2)hr2.innerHTML="<div class='card'>"+html+"</div>";
}
function revealEstimate(auto=false){
  const sol=Number(D.estimate[eidx][1]), pts=[2,1,0];
  const arr=["team1","team2","team3"].filter(t=>answers[t]!==undefined)
    .map(t=>[t,Number(answers[t]),Math.abs(Number(answers[t])-sol)]).sort((a,b)=>a[2]-b[2]);
  if(!estimateAwarded.has(eidx)){
    arr.forEach((x,i)=>estimateScores[x[0]]=(estimateScores[x[0]]||0)+(pts[i]||0));
    estimateAwarded.add(eidx);
  }
  let html="<p><b>Lösung: "+sol.toLocaleString("de-DE")+" km</b></p>";
  arr.forEach((x,i)=>html+="<div class='status "+(i===0?"ok":"")+"'><b>"+(i+1)+". Platz · "+(pts[i]||0)+" Punkt"+((pts[i]||0)===1?"":"e")+":</b> "+D.teams[x[0]].name+" – "+x[1].toLocaleString("de-DE")+" km</div>");
  html+=estimateScoreHtml(estimateScores);
  const hr=$("hostReveal"); if(hr)hr.innerHTML="<div class='card'>"+html+"</div>";
  sendAll({type:"reveal",html,scores:{...estimateScores},scoreKind:"estimate",kind:"estimate"});
  renderHost();
  const hr2=$("hostReveal"); if(hr2)hr2.innerHTML="<div class='card'>"+html+"</div>";
}

function startBuzzAnswerTimer(){

  buzzExpired=false; buzzAnswerEnd=Date.now()+10000;
  broadcastBuzzOrder(); renderHost();
  buzzAnswerTimer=setInterval(()=>{
    const el=$("buzzAnswerCountdown");
    const left=Math.max(0,Math.ceil((buzzAnswerEnd-Date.now())/1000));

  },150);

function nextBuzzAnswer(){

function simpleNorm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
}
function emojiCorrect(input,target){
  const a=simpleNorm(input), b=simpleNorm(target);
  if(a===b)return true;
  return editDistance(a,b)<=Math.max(1,Math.min(2,Math.floor(b.length/8)));
}

function zgRanking(){
  const rem=zgRemaining();
  if(zgRound===0){
    return rem.map(n=>({name:n,value:zgAnswers[n],valid:true,score:Math.abs(Number(zgAnswers[n])-5101)}))
      .filter(x=>Number.isFinite(x.value)).sort((a,b)=>a.score-b.score);
  }
  if(zgRound===1){
    return rem.map(n=>({name:n,value:zgAnswers[n],valid:true,score:Math.abs(Number(zgAnswers[n])-10000)}))
      .filter(x=>Number.isFinite(x.value)).sort((a,b)=>a.score-b.score);
  }
  if(zgRound===2){
    return rem.map(n=>({name:n,value:zgAnswers[n],valid:Number(zgAnswers[n])<=1831,score:Math.abs(Number(zgAnswers[n])-1831)}))
      .filter(x=>Number.isFinite(x.value)).sort((a,b)=>(b.valid-a.valid)||a.score-b.score);
  }
  if(zgRound===3){
    return rem.map(n=>{
      const a=zgAnswers[n]; if(!a)return null;
      return {name:n,value:a.ms,early:a.early,valid:true,score:Number(a.ms)+(a.early?1000:0)};
    }).filter(Boolean).sort((a,b)=>a.score-b.score);
  }
  return [];
}

    if(zgRound===1) val=(Number(x.value)/1000).toFixed(2).replace(".",",")+" s · Δ "+(x.score/1000).toFixed(2).replace(".",",")+" s";

function zgStartRpsTurn(){
  clearTimeout(zgRpsTimer); zgPhase="rps"; zgRpsChoices={}; zgLive={}; zgRpsToken++; zgRpsEnd=Date.now()+10000;
  zgRpsPlayers.forEach(n=>{

    zgSend(n,{type:"zgState",round:4,phase:"rps",players:zgRpsPlayers,lives:zgRpsLives,token:zgRpsToken,end:zgRpsEnd});
  });
  zgLiveBroadcast(); renderHost();
  const token=zgRpsToken;
  zgRpsTimer=setTimeout(()=>{if(zgPhase==="rps"&&zgRpsToken===token)zgResolveRps();},10100);
}
function zgResolveRps(){
  if(zgPhase!=="rps")return;
  clearTimeout(zgRpsTimer);
  const p=zgRpsPlayers, c=p.map(n=>zgRpsChoices[n]||null);
  let loser=null, text="";
  const missing=p.filter(n=>!zgRpsChoices[n]);
  if(missing.length===1){loser=missing[0];text=loser+" hat nicht gewählt und verliert ❤️.";}
  else if(missing.length>1){text="Mehrere ohne Auswahl – niemand verliert ein Leben.";}
  else{
    const uniq=[...new Set(c)];
    if(uniq.length===1){text="Alle drei gleich – niemand verliert ❤️.";}
    else if(uniq.length===3){text="Stein, Schere und Papier – niemand verliert ❤️.";}
    else{
      const counts={}; c.forEach(x=>counts[x]=(counts[x]||0)+1);
      const single=Object.keys(counts).find(x=>counts[x]===1);
      const pair=Object.keys(counts).find(x=>counts[x]===2);
      const beats={Stein:"Schere",Schere:"Papier",Papier:"Stein"};
      if(beats[pair]===single){
        loser=p[c.indexOf(single)];
        text=pair+" schlägt "+single+" – "+loser+" verliert ❤️.";
      }else{
        const pairPlayers=p.filter((n,i)=>c[i]===pair);
        pairPlayers.forEach(n=>zgRpsLives[n]=Math.max(0,zgRpsLives[n]-1));
        text=single+" schlägt "+pair+" – "+pairPlayers.join(" & ")+" verlieren je ❤️.";
      }
    }
  }
  if(loser)zgRpsLives[loser]=Math.max(0,zgRpsLives[loser]-1);
  const eliminated=p.filter(n=>zgRpsLives[n]===0);
  const choices={};p.forEach((n,i)=>choices[n]=c[i]);
  if(eliminated.length){
    // If two hit zero simultaneously, the one with fewer lives before this edge case is not distinguishable;
    // use a sudden-death-safe fallback by restoring both to 1 and continuing.
    if(eliminated.length>1){
      eliminated.forEach(n=>zgRpsLives[n]=1);
      text+=" Gleichzeitiges Ausscheiden – beide bekommen 1 ❤️ zurück, weiter geht's.";
      zgRpsPlayers.forEach(n=>zgSend(n,{type:"zgRpsResult",text,choices,lives:zgRpsLives,winner:null}));
      zgPhase="rpsBetween"; renderHost(); return;
    }
    const couch=eliminated[0], duo=p.filter(n=>n!==couch);
    zgDuos.push(duo); duo.forEach(n=>zgOut.add(n));
    zgWinner=duo.join(" + "); zgPhase="paired";
    zgRpsPlayers.forEach(n=>zgSend(n,{type:"zgRpsResult",text,choices,lives:zgRpsLives,winner:zgWinner,couch,duo}));
    renderHost(); return;
  }
  zgRpsPlayers.forEach(n=>zgSend(n,{type:"zgRpsResult",text,choices,lives:zgRpsLives,winner:null}));
  zgPhase="rpsBetween"; renderHost();
}

      document.querySelectorAll("[data-rps]").forEach(x=>x.disabled=true);
      b.classList.add("good"); clearInterval(timerInt);$("playerCountdown").textContent="";
      conn.send({type:"zgRpsChoice",name,choice:b.dataset.rps,token:m.token});
      $("playerAlert").innerHTML="<b>Gewählt: "+b.dataset.rps+"</b><br>Warte auf die anderen …";
    });
  }
}

}

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function editDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(
      dp[i-1][j]+1,
      dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
    );
  }
  return dp[m][n];
}
function fuzzyMatch(input,list){
  const ni=norm(input);
  if(!ni)return null;
  let best=null,bestDist=999;
  for(const x of list){
    const nx=norm(x);
    if(nx===ni)return x;
    if(ni.length>=4 && (nx.includes(ni)||ni.includes(nx))) return x;
    const d=editDistance(ni,nx);
    if(d<bestDist){bestDist=d;best=x;}
  }
  // 1 typo for short answers; up to 2 for medium/long answers.
  const allowed=ni.length<=4?1:(ni.length<=8?2:2);
  return bestDist<=allowed?best:null;
}
function categoryMatches(input,list){
  const ni=norm(input); if(!ni)return [];
  // Eine eindeutige Teilantwort wie „Müller“ darf mehrere vollständige Lösungen treffen.
  let matches=list.filter(x=>{const nx=norm(x);return nx===ni || (ni.length>=4 && nx.split(" ").includes(ni)) || (ni.length>=4 && nx.includes(ni));});
  if(matches.length)return matches;
  const one=fuzzyMatch(input,list); return one?[one]:[];
}
function rejectCategory(t){
  const a=answers[t];
  if(a===undefined)return;
  catOut.add(t);
  const msg={type:"categoryRejected",team:D.teams[t].name,answer:String(a),usedCount:used.size,totalCount:D.categories[catName].length};
  ["team1","team2","team3"].forEach(k=>{if(conns[k])conns[k].send(msg);});
  if(conns.screen)conns.screen.send(msg);
  answers={}; renderHost();
}
function acceptCategory(t){
  const a=answers[t], list=D.categories[catName];
  let matches=categoryMatches(a,list);

  // Wenn die Eingabe nicht eindeutig erkannt wird, kann der Spielleiter
  // sie manuell einer gültigen Lösung zuordnen (z. B. „Kinmich“ -> „Kimmich“).
  if(!matches.length){
    const manual=prompt(
      "Nicht eindeutig erkannt: "+a+"\n\n"+
      "Welche gültige Lösung ist gemeint?\n"+
      "Du kannst z. B. nur den Nachnamen eingeben (z. B. Kimmich)."
    );
    if(manual===null || !manual.trim())return;
    matches=categoryMatches(manual,list);
    if(!matches.length){
      alert("Auch diese Zuordnung wurde nicht gefunden: "+manual+"\nBitte prüfe die Schreibweise oder werte die Antwort mit dem roten X als falsch.");
      return;
    }
  }

  const fresh=matches.filter(x=>!used.has(norm(x)));
  if(!fresh.length){alert("Schon genannt: "+matches.join(" + "));return;}
  fresh.forEach(x=>used.add(norm(x)));
  const msg={type:"categoryAccepted",team:D.teams[t].name,answer:String(a),matches:fresh,usedCount:used.size,totalCount:D.categories[catName].length};
  ["team1","team2","team3"].forEach(k=>{if(conns[k])conns[k].send(msg);});
  if(conns.screen)conns.screen.send(msg);
  answers={}; renderHost();
}
